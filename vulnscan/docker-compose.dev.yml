# Development override: live-reload the API from your local source.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    command: ["uvicorn", "vulnscan.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/vulnscan"]
    volumes:
      - scan-data:/data
      - ./vulnscan:/app/vulnscan
  worker:
    volumes:
      - scan-data:/data
      - ./vulnscan:/app/vulnscan
