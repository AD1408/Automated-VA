[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.1.0"
description = "End-to-end vulnerability scanning orchestrator: repos, ZIPs, websites and LLM apps -> one report"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "typer>=0.12",
  "rich>=13.7",
  "rank-bm25>=0.2.2",
  "dnspython>=2.6",
  "markdown>=3.6",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["weasyprint>=62"]
openvas = ["python-gvm>=24.1"]
mcp = ["mcp>=1.9"]
ai = ["transformers>=4.44", "torch>=2.3"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
vulnscan = "vulnscan.cli:app"

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["rules/*.yml", "knowledge/*.md", "report/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# Intentional in a scanner: it runs external tools via subprocess with fixed argument
# lists (no shell), and uses best-effort try/except cleanup. These are low-severity notes.
skips = ["B404", "B603", "B110"]
